; Version ESP-IDF. Mismo protocolo que la version Arduino.
; El rol sale de un flag. Sin ROLE_GW se compila como nodo.
;   node_s3mini  ESP32-S3 Super Mini, NODE_ID 0, zona lumbar
;   node_xiao    XIAO ESP32C3, NODE_ID 1, espalda alta o esternon
;   gw_nano      Arduino Nano ESP32, gateway por USB Serial JTAG

[platformio]
default_envs = node_s3mini

[env]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200

[env:node_s3mini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
build_flags = -DNODE_ID=0

[env:node_xiao]
board = seeed_xiao_esp32c3
build_flags = -DNODE_ID=1

[env:gw_nano]
board = arduino_nano_esp32
build_flags = -DROLE_GW=1
upload_protocol = esptool
