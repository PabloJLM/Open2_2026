; Version ESP-IDF. Mismo protocolo que la version Arduino.
; El rol sale de un flag. Sin ROLE_GW se compila como nodo.
;   node_c3mini  ESP32-C3 Super Mini, NODE_ID 0, zona lumbar
;   node_xiao    XIAO ESP32C3, NODE_ID 1, espalda alta o esternon
;   gw_xiao      XIAO ESP32C3, gateway por USB Serial JTAG (segunda XIAO)

[platformio]
default_envs = node_c3mini

[env]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200

[env:node_c3mini]
board = esp32-c3-devkitm-1
build_flags = -DNODE_ID=0

[env:node_xiao]
board = seeed_xiao_esp32c3
build_flags = -DNODE_ID=1

[env:gw_xiao]
board = seeed_xiao_esp32c3
build_flags = -DROLE_GW=1
