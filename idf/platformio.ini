; Version ESP-IDF. Mismo protocolo que la version Arduino.
; El rol sale de un flag. Sin ROLE_GW se compila como nodo.
;   node_c3   ESP32 Super Mini C3, NODE_ID 1, espalda alta o esternon
;   node_s3   XIAO ESP32S3, NODE_ID 0, zona lumbar
;   gw_nano   Arduino Nano ESP32, gateway por USB Serial JTAG

[platformio]
default_envs = node_c3

[env]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200

[env:node_c3]
board = esp32-c3-devkitm-1
build_flags = -DNODE_ID=1

[env:node_s3]
board = seeed_xiao_esp32s3
build_flags = -DNODE_ID=0

[env:gw_nano]
board = arduino_nano_esp32
build_flags = -DROLE_GW=1
upload_protocol = esptool
