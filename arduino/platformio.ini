; Version Arduino. Tres entornos
;   node_c3mini  ESP32-C3 Super Mini, NODE_ID 0, zona lumbar
;   node_xiao    XIAO ESP32C3, NODE_ID 1, espalda alta o esternon
;   gw_xiao      XIAO ESP32C3, gateway (segunda XIAO)
; Los NODE_ID son arbitrarios, cambialos con -DNODE_ID si lo necesitas.

[platformio]
default_envs = node_c3mini

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:node_c3mini]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<node/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DNODE_ID=0

[env:node_xiao]
board = seeed_xiao_esp32c3
build_src_filter = -<*> +<node/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DNODE_ID=1

[env:gw_xiao]
board = seeed_xiao_esp32c3
build_src_filter = -<*> +<gw/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
