; Version Arduino. Tres entornos
;   node_c3   ESP32 Super Mini C3, NODE_ID 1, espalda alta o esternon
;   node_s3   XIAO ESP32S3, NODE_ID 0, zona lumbar
;   gw_nano   Arduino Nano ESP32, gateway
; Los NODE_ID son arbitrarios, cambialos con -DNODE_ID si lo necesitas.

[platformio]
default_envs = node_c3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:node_c3]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<node/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DNODE_ID=1

[env:node_s3]
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<node/>
build_flags =
  ${env.build_flags}
  -DNODE_ID=0

[env:gw_nano]
board = arduino_nano_esp32
build_src_filter = -<*> +<gw/>
